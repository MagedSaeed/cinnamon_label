<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cinnamon Label: the curled end of a cinnamon quill (also a "C"), with speech segments
       coming out of its opening. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2A44"/><stop offset="1" stop-color="#2D3E66"/></linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D98A55"/><stop offset="1" stop-color="#A9592E"/></linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- outer layer of bark: open on the right -->
  <path d="M78.0 40.0 A34 34 0 1 0 78.0 88.0" fill="none" stroke="url(#bark)" stroke-width="13" stroke-linecap="round"/>
  <!-- inner rolled layer: open at the bottom left -->
  <path d="M41.0 74.9 A17 17 0 1 1 59.8 80.0" fill="none" stroke="#EFB98F" stroke-width="9" stroke-linecap="round"/>
  <!-- speech segments -->
  <rect x="86" y="54" width="7" height="20" rx="3.5" fill="#F6E3D3"/>
  <rect x="97" y="44" width="7" height="40" rx="3.5" fill="#F6E3D3"/>
  <rect x="108" y="51" width="7" height="26" rx="3.5" fill="#F6E3D3"/>
</svg>
